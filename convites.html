  <symbol id="i-hw" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>

<main class="shell">
  <header class="topbar">
    <a class="brand" href="professora.html"><span class="brand-mark">Aa</span><span data-app-name>Sala de Inglês</span></a>
    <button class="icon-btn" id="logout" type="button"><svg><use href="#i-out"/></svg>Sair</button>
  </header>

  <div class="page-head">
    <a class="back" href="professora.html"><svg><use href="#i-back"/></svg>Início</a>
    <h1 class="page-title">Pré-cadastro de alunos</h1>
    <p class="hello-sub">Libere o primeiro acesso de cada aluno.</p>
  </div>

  <div class="two-col">
    <section class="panel" aria-labelledby="t-new">
      <h2 id="t-new">Novo convite</h2>
      <p class="lead">O aluno usa estes dados em “Primeiro acesso” para criar a conta.</p>
      <form class="form-grid" id="f-invite" novalidate>
        <div class="field">
          <label for="i-email">E-mail do aluno</label>
          <input class="input" id="i-email" type="email" inputmode="email" autocomplete="off" placeholder="aluno@exemplo.com" required>
        </div>
        <div class="field">
          <label for="i-birth">Data de nascimento</label>
          <input class="input" id="i-birth" type="date" min="1920-01-01" required>
        </div>
        <div class="field">
          <label for="i-level">Nível</label>
          <select class="input" id="i-level">
            <option value="">Definir depois</option>
            <option>Iniciante</option>
            <option>Básico</option>
            <option>Intermediário</option>
            <option>Avançado</option>
          </select>
        </div>
        <div class="alert" id="a-invite" role="alert"></div>
        <button class="btn btn-primary" type="submit">Cadastrar convite</button>
      </form>
    </section>

    <section aria-labelledby="t-list">
      <div class="list-head">
        <h2 class="serif" id="t-list">Convites</h2>
        <div class="chips" role="group" aria-label="Filtrar">
          <button class="chip" type="button" data-f="todos" aria-pressed="true">Todos</button>
          <button class="chip" type="button" data-f="pendente" aria-pressed="false">Aguardando</button>
          <button class="chip" type="button" data-f="ativo" aria-pressed="false">Ativos</button>
        </div>
      </div>
      <input class="input search" id="q" type="search" placeholder="Buscar por e-mail" aria-label="Buscar por e-mail">
      <div class="invites" id="list"></div>
      <p class="count" id="count"></p>
    </section>
  </div>
</main>

<div class="waves"><svg><use href="#waves"/></svg></div>
<script type="module" src="js/convites.js"></script>
</body>
</html>
