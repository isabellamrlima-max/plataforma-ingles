<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Área da professora · ISpeak</title>
  <meta name="description" content="ISpeak by Isabella — English learning. More confidence. More opportunities.">
  <meta name="theme-color" content="#f5f1eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ISpeak">
  <link rel="preload" href="assets/fonts/bodoni-moda-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/brand.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="is-loading">
<main class="shell">
  <header class="topbar">
    <a class="logo" href="professora.html" aria-label="ISpeak by Isabella — início"><span class="logo-word">ISpeak</span><span class="logo-by">by Isabella</span></a>
    <button class="icon-btn" id="logout" type="button"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#out"/></svg>Sair</button>
  </header>

  <div class="dash">
    <div>
      <div class="greet">
        <h1 class="hello">Olá, professora!</h1>
        <p class="hello-sub">Vamos organizar suas aulas?</p>
      </div>
      <nav class="tiles" aria-label="Menu da professora">
        <a class="tile" href="#" data-soon="Meus Alunos">
          <span class="bubble taupe"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#users"/></svg></span>
          <span class="tile-foot"><span class="tile-label">Meus Alunos</span><svg class="chev" aria-hidden="true"><use href="assets/icons/sprite.svg#chev"/></svg></span>
        </a>
        <a class="tile" href="prof-homework.html">
          <span class="bubble blush"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#homework-plus"/></svg></span>
          <span class="tile-foot"><span class="tile-label">Cadastrar Homework</span><svg class="chev" aria-hidden="true"><use href="assets/icons/sprite.svg#chev"/></svg></span>
        </a>
        <a class="tile wide" href="prof-convites.html">
          <span class="bubble taupe"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#user-plus"/></svg></span>
          <span class="tile-label">Pré-cadastrar aluno<small class="tile-sub" id="pend-count"></small></span>
          <svg class="chev" aria-hidden="true"><use href="assets/icons/sprite.svg#chev"/></svg>
        </a>
        <a class="tile wide" href="#" data-soon="Próximas Aulas">
          <span class="bubble blush"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#calendar"/></svg></span>
          <span class="tile-label">Próximas Aulas</span>
          <svg class="chev" aria-hidden="true"><use href="assets/icons/sprite.svg#chev"/></svg>
        </a>
        <a class="tile wide" href="perfil.html">
          <span class="avatar" id="avatar">P</span>
          <span class="tile-label">Perfil</span>
          <svg class="chev" aria-hidden="true"><use href="assets/icons/sprite.svg#chev"/></svg>
        </a>
      </nav>
    </div>

    <section class="side" aria-labelledby="t-agenda">
      <div class="side-head">
        <h2 class="section-title" id="t-agenda">Agenda de hoje</h2>
      </div>
      <div id="agenda"></div>
    </section>
  </div>
  <footer class="foot">
    <p class="tagline">A new language opens new doors.</p>
    <span class="eyebrow">ISpeak by Isabella</span>
  </footer>
</main>
<script type="module" src="assets/js/pages/professora.js"></script>
</body>
</html>
