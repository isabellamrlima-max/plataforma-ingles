<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fazer homework · ISpeak</title>
  <meta name="description" content="ISpeak by Isabella — English learning. More confidence. More opportunities.">
  <meta name="theme-color" content="#f5f1eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ISpeak">
  <link rel="preload" href="assets/fonts/bodoni-moda-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/brand.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="is-loading">
<main class="shell doing">
  <header class="topbar">
    <a class="logo" href="aluno.html" aria-label="ISpeak by Isabella — início"><span class="logo-word">ISpeak</span><span class="logo-by">by Isabella</span></a>
    <button class="icon-btn" id="logout" type="button"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#out"/></svg>Sair</button>
  </header>

  <div class="page-head">
    <a class="back" href="aluno-homework.html"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#back"/></svg>Homework</a>
    <span class="eyebrow" id="hw-meta"></span>
    <h1 class="page-title" id="hw-title">Carregando…</h1>
    <p class="hello-sub" id="hw-inst"></p>
  </div>
  <div class="last-try" id="last-try" hidden></div>
  <section class="result" id="result" hidden aria-live="polite"></section>
  <div class="q-list" id="questions"></div>

  <div class="savebar">
    <span class="savebar-status" id="progress"></span>
    <div class="savebar-actions">
      <button class="btn btn-primary" type="button" id="btn-send">Enviar respostas</button>
    </div>
  </div>
</main>
<script type="module" src="assets/js/pages/aluno-homework-fazer.js"></script>
</body>
</html>
