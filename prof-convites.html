<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pré-cadastro · ISpeak</title>
  <meta name="description" content="ISpeak by Isabella — English learning. More confidence. More opportunities.">
  <meta name="theme-color" content="#f5f1eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ISpeak">
  <link rel="preload" href="assets/fonts/bodoni-moda-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/brand.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="is-loading">
<main class="shell">
  <header class="topbar">
    <a class="logo" href="professora.html" aria-label="ISpeak by Isabella — início"><span class="logo-word">ISpeak</span><span class="logo-by">by Isabella</span></a>
    <button class="icon-btn" id="logout" type="button"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#out"/></svg>Sair</button>
  </header>

  <div class="page-head">
    <a class="back" href="professora.html"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#back"/></svg>Início</a>
    <h1 class="page-title">Pré-cadastro de alunos</h1>
    <p class="hello-sub">Libere o primeiro acesso de cada aluno.</p>
  </div>

  <div class="two-col">
    <section class="panel" aria-labelledby="t-new">
      <h2 id="t-new">Novo convite</h2>
      <p class="lead">O aluno usa estes dados em “Primeiro acesso” para criar a conta.</p>
      <form class="form-grid" id="f-invite" novalidate>
        <div class="field">
          <label for="i-email">E-mail do aluno</label>
          <input class="input" id="i-email" type="email" inputmode="email" autocomplete="off" placeholder="aluno@exemplo.com" required>
        </div>
        <div class="field">
          <label for="i-birth">Data de nascimento</label>
          <input class="input" id="i-birth" type="date" min="1920-01-01" required>
        </div>
        <div class="field">
          <label for="i-level">Nível</label>
          <select class="input" id="i-level">
            <option value="">Definir depois</option>
            <option>Iniciante</option>
            <option>Básico</option>
            <option>Intermediário</option>
            <option>Avançado</option>
          </select>
        </div>
        <div class="alert" id="a-invite" role="alert"></div>
        <button class="btn btn-primary" type="submit">Cadastrar convite</button>
      </form>
    </section>

    <section aria-labelledby="t-list">
      <div class="list-head">
        <h2 id="t-list">Convites</h2>
        <div class="chips" role="group" aria-label="Filtrar">
          <button class="chip" type="button" data-f="todos" aria-pressed="true">Todos</button>
          <button class="chip" type="button" data-f="pendente" aria-pressed="false">Aguardando</button>
          <button class="chip" type="button" data-f="ativo" aria-pressed="false">Ativos</button>
        </div>
      </div>
      <input class="input search" id="q" type="search" placeholder="Buscar por nome ou e-mail" aria-label="Buscar">
      <div class="invites" id="list"></div>
      <p class="count" id="count"></p>
    </section>
  </div>
  <footer class="foot">
    <p class="tagline">A new language opens new doors.</p>
    <span class="eyebrow">ISpeak by Isabella</span>
  </footer>
</main>
<script type="module" src="assets/js/pages/prof-convites.js"></script>
</body>
</html>
