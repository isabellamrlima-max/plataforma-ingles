<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nova senha · ISpeak</title>
  <meta name="description" content="ISpeak by Isabella — English learning. More confidence. More opportunities.">
  <meta name="theme-color" content="#f5f1eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ISpeak">
  <link rel="preload" href="assets/fonts/bodoni-moda-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/brand.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="auth">
  <main class="auth-main" style="justify-content:center">
    <div class="auth-brand" style="display:flex">
      <span class="logo lg"><span class="logo-word">ISpeak</span><span class="logo-by">by Isabella</span></span>
      <hr class="rule">
      <span class="eyebrow">English learning</span>
    </div>
    <section class="view">
      <h1 class="auth-title">Crie uma nova senha</h1>
      <p class="auth-sub">Escolha uma senha com pelo menos 8 caracteres.</p>
      <form class="form" id="f-reset" novalidate>
        <div class="field">
          <label for="n-pass">Nova senha</label>
          <div class="input-wrap">
            <input class="input" id="n-pass" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" minlength="8" required>
            <button class="peek" type="button" aria-label="Mostrar senha" data-peek="n-pass"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#eye"/></svg></button>
          </div>
        </div>
        <div class="field">
          <label for="n-pass2">Confirme a nova senha</label>
          <input class="input" id="n-pass2" type="password" autocomplete="new-password" placeholder="Repita a senha" required>
        </div>
        <div class="alert" id="a-reset" role="alert"></div>
        <button class="btn btn-primary" type="submit">Salvar nova senha</button>
      </form>
    </section>
  </main>
</div>
<script type="module" src="assets/js/pages/redefinir.js"></script>
</body>
</html>
